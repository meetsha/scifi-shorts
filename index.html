<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SciFi Short Story Collection</title>
    <meta
      name="description"
      content="Hugo Best Short Story winners from 2001 through 2025."
    />
    <meta name="theme-color" content="#050807" />
    <meta property="og:title" content="SciFi Short Story Collection" />
    <meta
      property="og:description"
      content="Hugo Best Short Story winners from 2001 through 2025."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to catalogue</a>
    <header class="site-header">
      <div class="wrap">
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="site-mark" href="index.html" aria-current="page">
            <span aria-hidden="true"></span>
            Collection 01
          </a>
          <a href="about.html">About</a>
        </nav>
        <h1>SciFi Short Story Collection</h1>
        <p class="subtitle">Hugo Best Short Story winners, 2001–2025.</p>
      </div>
    </header>

    <main id="main-content" class="wrap">
      <section class="controls" aria-label="Search controls">
        <div class="award-filter">
          <span class="control-label">Award</span>
          <div class="award-options" role="group" aria-label="Filter by award">
            <button type="button" data-award="all" aria-pressed="true">All awards</button>
            <button type="button" data-award="hugo" aria-pressed="false">Hugo</button>
            <button type="button" data-award="nebula" aria-pressed="false">Nebula</button>
          </div>
        </div>
        <div class="control control--search">
          <label for="search">Search the catalogue</label>
          <input
            id="search"
            type="search"
            placeholder="Story, author, publication, or year..."
            autocomplete="off"
          />
        </div>
        <div class="control control--select">
          <label for="year-filter">Award year</label>
          <select id="year-filter">
            <option value="">All years</option>
          </select>
        </div>
        <div class="control control--select">
          <label for="sort-order">Sort order</label>
          <select id="sort-order">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
        <button id="reset-filters" class="reset-button" type="button" disabled>Reset</button>
      </section>

      <section class="catalogue" aria-labelledby="catalogue-title">
        <div class="catalogue-heading">
          <h2 id="catalogue-title">Award results</h2>
          <p id="result-count" aria-live="polite"></p>
        </div>
        <ul id="story-list" class="story-list"></ul>
        <nav id="pagination" class="pagination" aria-label="Catalogue pages" hidden>
          <button id="previous-page" type="button">Previous</button>
          <div id="page-numbers" class="page-numbers"></div>
          <span id="page-status" class="page-status" aria-live="polite"></span>
          <button id="next-page" type="button">Next</button>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>An independent index. Story links lead to external publications.</p>
        <p><a href="about.html">Methodology and corrections</a></p>
      </div>
    </footer>

    <script type="module" src="app.js?v=3"></script>
  </body>
</html>
