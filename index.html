<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SciFi Short Stories</title>
    <meta
      name="description"
      content="An independent archive of Hugo and Nebula award-winning short fiction."
    />
    <meta name="theme-color" content="#050807" />
    <meta property="og:title" content="SciFi Short Stories" />
    <meta
      property="og:description"
      content="An independent archive of Hugo and Nebula award-winning short fiction."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scifi-shorts.pages.dev/" />
    <link rel="canonical" href="https://scifi-shorts.pages.dev/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/fonts/ibm-plex-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/ibm-plex-mono-500-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/ibm-plex-mono-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/space-mono-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/styles/styles.css?v=30" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to catalogue</a>
    <header class="site-header">
      <div class="wrap">
        <h1 class="site-title">
          <a href="index.html">
            SciFi Short Stories<span class="title-cursor" aria-hidden="true"></span>
          </a>
        </h1>
        <p class="subtitle">
          Hugo and Nebula short story winners
          <span class="subtitle-context">
            <span class="subtitle-separator" aria-hidden="true">·</span>
            <a class="subtitle-link" href="about.html">Why these stories?</a>
          </span>
        </p>
      </div>
    </header>

    <main id="main-content" class="wrap">
      <section class="controls" aria-label="Search controls">
        <div class="award-filter">
          <div class="award-options" role="group" aria-label="Filter by award">
            <button type="button" data-award="all" aria-pressed="true">All awards</button>
            <button type="button" data-award="hugo" aria-pressed="false">Hugo</button>
            <button type="button" data-award="nebula" aria-pressed="false">Nebula</button>
          </div>
        </div>
        <div class="control control--search">
          <label for="search">Search the catalogue</label>
          <input
            id="search"
            type="search"
            placeholder="Story, author, or year"
            autocomplete="off"
          />
        </div>
        <div class="control control--select">
          <label for="sort-order">Sort order</label>
          <select id="sort-order">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
        <button id="reset-filters" class="reset-button" type="button" disabled>Reset</button>
      </section>

      <section class="catalogue" aria-labelledby="catalogue-title" aria-busy="true">
        <h2 id="catalogue-title" class="sr-only">Award-winning stories</h2>
        <p
          id="result-status"
          class="sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
        <nav
          class="pagination pagination--top"
          data-pagination
          aria-label="Catalogue pages, top"
        >
          <button type="button" data-page-action="previous" disabled>Previous</button>
          <div class="page-numbers" data-page-numbers></div>
          <span class="page-status" data-page-status></span>
          <button type="button" data-page-action="next" disabled>Next</button>
        </nav>
        <ul id="story-list" class="story-list"></ul>
        <nav
          class="pagination"
          data-pagination
          aria-label="Catalogue pages, bottom"
          hidden
        >
          <button type="button" data-page-action="previous" disabled>Previous</button>
          <div class="page-numbers" data-page-numbers></div>
          <span class="page-status" data-page-status aria-live="polite"></span>
          <button type="button" data-page-action="next" disabled>Next</button>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p><a href="about.html">About this collection</a></p>
      </div>
    </footer>

    <script type="module" src="assets/js/app.js?v=24"></script>
  </body>
</html>
